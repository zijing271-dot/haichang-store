<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Result — Haichang Brand</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="site-header"></div>

  <main class="mx-auto max-w-2xl px-4 py-16">
    <div id="card" class="rounded-2xl border border-gray-100 bg-white p-8 text-center shadow-sm">
      <div id="icon" class="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full"></div>
      <h1 id="title" class="text-2xl font-extrabold tracking-tight"></h1>
      <p id="subtitle" class="mt-2 text-gray-500"></p>

      <div id="order-box" class="mt-6 hidden rounded-xl bg-gray-50 p-5 text-left text-sm">
        <div class="flex justify-between py-1"><span class="text-gray-500">Order number</span><span id="o-id" class="font-semibold"></span></div>
        <div class="flex justify-between py-1"><span class="text-gray-500">Amount paid</span><span id="o-amount" class="font-semibold"></span></div>
        <div class="flex justify-between py-1"><span class="text-gray-500">Status</span><span id="o-status" class="font-semibold"></span></div>
      </div>

      <div class="mt-8 flex justify-center gap-3">
        <a href="index.html" class="rounded-lg bg-gray-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-gray-800">Continue shopping</a>
        <a href="contact.html" class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-semibold hover:bg-gray-50">Need help?</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    var q = new URLSearchParams(location.search);
    // 兼容多种回跳参数命名（OMEGA / Airwallex 可能用 status / payment_status / result）
    var status = (q.get('status') || q.get('payment_status') || q.get('result') || '').toLowerCase();
    var success = ['success', 'succeeded', 'paid', 'completed'].indexOf(status) !== -1;

    var order = null;
    try { order = JSON.parse(sessionStorage.getItem('omega_last_order')); } catch (e) {}

    var icon = document.getElementById('icon');
    if (success) {
      icon.className = 'mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full bg-emerald-100 text-emerald-600';
      icon.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>';
      document.getElementById('title').textContent = 'Payment successful';
      document.getElementById('subtitle').textContent = 'Thank you! A confirmation email will be sent to you shortly.';
      Cart.clear(); // 成功后清空购物车
    } else {
      icon.className = 'mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full bg-rose-100 text-rose-600';
      icon.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>';
      document.getElementById('title').textContent = 'Payment not completed';
      document.getElementById('subtitle').textContent = 'Your payment was cancelled or failed. You have not been charged. Please try again.';
    }

    var oid = q.get('order') || (order && order.orderId);
    var amount = q.get('amount') || (order && order.amounts && order.amounts.total);
    var currency = q.get('currency') || (order && order.currency) || SITE_CONFIG.currency.code;
    if (oid) {
      document.getElementById('order-box').classList.remove('hidden');
      document.getElementById('o-id').textContent = oid;
      document.getElementById('o-amount').textContent = amount != null ? UI.money(Number(amount)) + ' ' + currency : '—';
      document.getElementById('o-status').textContent = success ? 'Paid' : 'Unpaid';
    }

    if (q.get('mock') === '1') {
      var d = document.createElement('p');
      d.className = 'mt-4 text-xs text-amber-600';
      d.textContent = '（演示模式：此为模拟交易，未发生真实扣款。）';
      document.getElementById('card').appendChild(d);
    }
  </script>
</body>
</html>
